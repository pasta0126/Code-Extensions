schema: spec-driven

context: |
  Repositorio con varias extensiones de VS Code, una carpeta por extensión dentro de extensions/ (extensions/kanban-json/, ...).
  OpenSpec es compartido: los specs de cada extensión van bajo specs/<extension>/<capability>/spec.md.
  Extensión kanban-json: muestra y mantiene un tablero Kanban a partir de kanban.json.
  Stack: TypeScript, esbuild, vitest, webview vanilla (sin framework).
  Metodología: SDD (spec-driven development) con OpenSpec: primero propuesta/specs/diseño/tareas, luego código.
  Estructura: extensions/kanban-json/src/board (núcleo puro, NO importa "vscode"), extensions/kanban-json/src/editor (adaptador VS Code), extensions/kanban-json/media (webview).
  Idioma: specs y documentación en español; código e identificadores en inglés.
  Modelo: Board > Column > Task. Los campos desconocidos de una tarea se conservan.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
